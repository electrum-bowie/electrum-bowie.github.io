<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="aframe-multiview.min.js"></script>
    <script src="index.js"></script>
    <script src="jszip.js"></script>
    <script src="input.js"></script>
    <script src="two-hand-manipulation.js"></script>
    <style>
        /* CSS for button */
        #fileButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            padding: 20px;
        }
        #backButton {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1;
            padding: 25px;
            display: none;
        }
        html, body {
            height: 100%;
            margin: 0;
            background-color: #5a5a5a;
        }
        label[for="fileInput"],
        #fileInput {
            display: none;
        }
        /* removed slider styles */

        #logMessage {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            background: rgba(0, 123, 255, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
            pointer-events: none; /* allow interaction with controls below */
        }

        /* Override A-Frame device permission UI button color */
        .a-dialog-deny-button {
            background-color: #00008b !important;
        }

    </style>
</head>
<body>
    <a-scene renderer="antialias: false; highRefreshRate: true; multiviewStereo: true; dithering: false" webxr="optionalFeatures: hand-tracking, layers, dom-overlay" xr-mode-ui="XRMode: xr">
        <a-entity id="rig" mobile-tap-move>
            <a-entity camera position="0 1.6 0" look-controls></a-entity>
            <a-entity id="rightController" oculus-touch-controls="hand: right"></a-entity>
            <a-entity id="leftController" oculus-touch-controls="hand: left"></a-entity>
            <a-entity id="rightHand" hand-tracking-controls="hand: right; modelStyle: mesh"></a-entity>
            <a-entity id="leftHand" hand-tracking-controls="hand: left; modelStyle: mesh"></a-entity>
        </a-entity>

        <!-- Add a container to hold the dynamically created entity -->
        <div id="entityContainer"></div>

        <!-- Add a button to trigger file selection -->
        <button id="fileButton" style="position: fixed; z-index: 1;">Select .zip, .ply or .splat File</button>
        <button id="backButton">Go Back</button>


        <!-- Display the most recent error message -->
        <div id="logMessage"></div>
    </a-scene>

    <label for="fileInput">Select .zip, .ply or .splat File:</label>
    <input type="file" id="fileInput">
    <script>
        let hideLogTimeout;
        const TYPE_ERROR_MESSAGE = "Browser Memory Limit Reached: Please compress or use a different capture. (contact.earthquest.site)";
        function displayLogMessage(message) {
            const logMessageElement = document.getElementById('logMessage');
            if (message.includes('TypeError')) {
                message = TYPE_ERROR_MESSAGE;
            }
            logMessageElement.textContent = message;
            logMessageElement.style.display = 'block';
            clearTimeout(hideLogTimeout);
            hideLogTimeout = setTimeout(() => {
                logMessageElement.style.display = 'none';
            }, 4500);
        }

        const origConsoleLog = console.log;
        const origConsoleWarn = console.warn;
        const origConsoleError = console.error;

        console.log = (...args) => {
            const msg = args.join(' ');
            if (msg.includes('TypeError')) {
                origConsoleLog(TYPE_ERROR_MESSAGE);
                displayLogMessage(TYPE_ERROR_MESSAGE);
            } else {
                origConsoleLog.apply(console, args);
                displayLogMessage(msg);
            }
        };

        console.warn = (...args) => {
            const msg = args.join(' ');
            if (msg.includes('Timestamp from devicemotion outside expected range')) {
                return;
            }
            if (msg.includes('TypeError')) {
                origConsoleWarn(TYPE_ERROR_MESSAGE);
                displayLogMessage(TYPE_ERROR_MESSAGE);
            } else {
                origConsoleWarn.apply(console, args);
                displayLogMessage(msg);
            }
        };

        console.error = (...args) => {
            const msg = args.join(' ');
            if (msg.includes('TypeError')) {
                origConsoleError(TYPE_ERROR_MESSAGE);
                displayLogMessage(TYPE_ERROR_MESSAGE);
            } else {
                origConsoleError.apply(console, args);
                displayLogMessage(msg);
            }
        };


    </script>
</body>
</html>
