<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="index.js"></script>
    <script src="dist/jszip.js"></script>
    <script src="input.js"></script>
    <script src="simple-fly.js"></script>
    <style>
        /* CSS for button */
        #fileButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            padding: 20px; /* 3 times bigger */
        }
        /* CSS for slider container */
        .slider-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%; /* Adjust the width as needed */
            z-index: 1;
        }

        /* CSS for the slider input */
        #slider {
            width: 100%;
        }

        /* CSS for the displayed value */
        #slider-value {
            text-align: center;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            width: 60px; /* Adjust the width as needed */
            margin: 0 auto;
        }

        #logMessage {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <a-scene renderer="antialias: false" stats>
        <a-entity oculus-touch-controls="hand: right"></a-entity>
        <a-entity oculus-touch-controls="hand: left"></a-entity>

        <!-- Add a container to hold the dynamically created entity -->
        <div id="entityContainer"></div>

        <a-entity oculus-touch-controls="hand: right" simple-fly="speed: -0.025"></a-entity>

        <!-- Add a button to trigger file selection -->
        <button id="fileButton" style="position: relative; z-index: 1;">Select .zip or .ply File</button>
        <div class="slider-container">
            <input type="range" min="1.0" max="6.0" step="0.5" value="5" id="slider">
            <span id="slider-value">5</span>
        </div>

        <!-- Display the most recent error message -->
        <div id="logMessage"></div>
    </a-scene>

    <label for="fileInput">Select .zip or .ply File:</label>
    <input type="file" id="fileInput" accept=".zip,.ply">
    <script>
        let hideLogTimeout;
        function displayLogMessage(message) {
            const logMessageElement = document.getElementById('logMessage');
            logMessageElement.textContent = message;
            logMessageElement.style.display = 'block';
            clearTimeout(hideLogTimeout);
            hideLogTimeout = setTimeout(() => {
                logMessageElement.style.display = 'none';
            }, 10000);
        }

        const origConsoleLog = console.log;
        const origConsoleWarn = console.warn;
        const origConsoleError = console.error;

        console.log = (...args) => {
            origConsoleLog.apply(console, args);
            displayLogMessage(args.join(' '));
        };

        console.warn = (...args) => {
            origConsoleWarn.apply(console, args);
            displayLogMessage(args.join(' '));
        };

        console.error = (...args) => {
            origConsoleError.apply(console, args);
            displayLogMessage(args.join(' '));
        };

        // Function to update the slider value
        function updateSliderValue() {
            const slider = document.getElementById('slider');
            const sliderValue = document.getElementById('slider-value');
            sliderValue.innerText = slider.value;
        }

        // Add an event listener to the slider input element
        const slider = document.getElementById('slider');
        slider.addEventListener('input', updateSliderValue);
    </script>
</body>
</html>
