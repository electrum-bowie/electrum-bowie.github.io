<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="index.js"></script>
    <script src="dist/jszip.js"></script>
    <script src="input.js"></script>
    <script src="simple-fly.js"></script>
    <script src="two-hand-manipulation.js"></script>
    <script src="mobile-tap-move.js"></script>
    <style>
        /* CSS for button */
        #fileButton {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            padding: 20px; /* 3 times bigger */
        }
        html, body {
            height: 100%;
            margin: 0;
        }
        label[for="fileInput"],
        #fileInput {
            display: none;
        }
        /* CSS for slider container */
        .slider-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%; /* Adjust the width as needed */
            z-index: 1;
        }

        /* CSS for the slider input */
        #slider {
            width: 100%;
        }

        /* CSS for the displayed value */
        #slider-value {
            text-align: center;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            width: 60px; /* Adjust the width as needed */
            margin: 0 auto;
        }

        #slider-label {
            text-align: center;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 5px;
        }

        #logMessage {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1;
            background: rgba(255, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;
            pointer-events: none; /* allow interaction with controls below */
        }

    </style>
</head>
<body>
    <a-scene renderer="antialias: false" stats>
        <a-entity oculus-touch-controls="hand: right"></a-entity>
        <a-entity oculus-touch-controls="hand: left"></a-entity>
        <a-entity camera position="0 1.6 0" look-controls mobile-tap-move></a-entity>

        <!-- Add a container to hold the dynamically created entity -->
        <div id="entityContainer"></div>

        <a-entity oculus-touch-controls="hand: right" simple-fly="speed: -0.025"></a-entity>

        <!-- Add a button to trigger file selection -->
        <button id="fileButton" style="position: fixed; z-index: 1;">Select .zip or .ply File</button>
        <div class="slider-container">
            <div id="slider-label">Quality factor:</div>
            <input type="range" min="1.0" max="6.0" step="0.5" value="5" id="slider">
            <span id="slider-value">5</span>
        </div>

        <!-- Display the most recent error message -->
        <div id="logMessage"></div>
    </a-scene>

    <label for="fileInput">Select .zip or .ply File:</label>
    <input type="file" id="fileInput" accept=".zip,.ply">
    <script>
        let hideLogTimeout;
        function displayLogMessage(message) {
            const logMessageElement = document.getElementById('logMessage');
            logMessageElement.textContent = message;
            logMessageElement.style.display = 'block';
            clearTimeout(hideLogTimeout);
            hideLogTimeout = setTimeout(() => {
                logMessageElement.style.display = 'none';
            }, 4500);
        }

        const origConsoleLog = console.log;
        const origConsoleWarn = console.warn;
        const origConsoleError = console.error;

        console.log = (...args) => {
            origConsoleLog.apply(console, args);
            displayLogMessage(args.join(' '));
        };

        console.warn = (...args) => {
            const msg = args.join(' ');
            if (msg.includes('Timestamp from devicemotion outside expected range')) {
                return;
            }
            origConsoleWarn.apply(console, args);
            displayLogMessage(msg);
        };

        console.error = (...args) => {
            origConsoleError.apply(console, args);
            displayLogMessage(args.join(' '));
        };

        // Store and update the latest slider value
        let latestSliderValue;

        function updateSliderValue() {
            const slider = document.getElementById('slider');
            const sliderValue = document.getElementById('slider-value');
            const min = parseFloat(slider.min);
            const max = parseFloat(slider.max);
            latestSliderValue = parseFloat(slider.value);
            const percent = Math.round((latestSliderValue - min) / (max - min) * 100);
            sliderValue.innerText = percent + '%';
        }

        // Initialize and listen for slider changes
        const slider = document.getElementById('slider');
        latestSliderValue = parseFloat(slider.value);
        updateSliderValue();
        slider.addEventListener('input', updateSliderValue);
        slider.addEventListener('change', updateSliderValue);

        const sliderValueElement = document.getElementById('slider-value');
        const sliderLabelElement = document.getElementById('slider-label');
        function syncSliderVisibility() {
            sliderValueElement.style.display = slider.style.display;
            if (sliderLabelElement) {
                sliderLabelElement.style.display = slider.style.display;
            }
        }
        syncSliderVisibility();
        new MutationObserver(syncSliderVisibility).observe(slider, {
            attributes: true,
            attributeFilter: ['style']
        });
    </script>
</body>
</html>
